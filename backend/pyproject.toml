[project]
name = "matchgist-backend"
version = "0.1.0"
description = "MatchGist: synthetic match intelligence fitted to each fan's channel, data budget, ping limit and language."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  # Microsoft Agent Framework: pinned because the API moves fast (checked Oct 21, 2026)
  "agent-framework-core==1.22.0",
  "agent-framework-openai==1.17.0",
]

[project.optional-dependencies]
foundry = [
  "agent-framework-foundry==1.15.0",
  "azure-identity>=1.17,<2",
]
vision = [
  "numpy==2.3.4",
  "pillow==11.3.0",
]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
